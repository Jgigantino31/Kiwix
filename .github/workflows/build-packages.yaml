name: Build Packages

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set environment variables
        run: |
          echo "VERSION=$(curl -s https://api.github.com/repos/linuxserver/docker-baseimage-ubuntu/releases/latest | jq -r '.tag_name')" >> $GITHUB_ENV
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jgigantino31/kiwix:latest, ghcr.io/jgigantino31/kiwix:${{ env.VERSION }}, ghcr.io/jgigantino31/kiwix:${{ env.DATE }}
